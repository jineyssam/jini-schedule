<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="지니 스케줄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>지니 스케줄</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#f1f3f8; --text:#111827; --text2:#374151; --muted:#6b7280; --faint:#9ca3af;
  --line:#e5e7eb; --blue:#2563eb; --blue-soft:#e8efff; --red:#e5484d; --sat:#3b6fd8; --green:#16a34a; --warn-bg:#fff7e6; --warn:#a15c00;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --tab-h:60px; --head-h:56px;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--blue)}
textarea{resize:vertical;min-height:90px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{width:20px;height:20px;flex:none}
.feed-head svg{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--surface);border-bottom:1px solid var(--line);min-height:var(--head-h)}
.top h1{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 button{font-weight:700;font-size:19px;display:inline-flex;align-items:center;gap:4px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);position:relative;flex:none}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.dot-badge{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9aa1ad;font-size:11px;font-weight:600}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected=true]{color:var(--blue)}

#banners{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);z-index:2000;display:flex;flex-direction:column;gap:6px;width:min(560px,calc(100% - 24px));pointer-events:none}
.banner{pointer-events:auto;background:#111827;color:#fff;border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;font-size:14px;animation:drop .2s ease}
.banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f3d19c}
.banner .b-x{margin-left:auto;opacity:.7;font-size:18px;line-height:1;color:inherit}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:2100;max-width:90%;text-align:center}

/* 공통 블록 */
.page{max-width:760px;margin:0 auto;padding:16px 16px 28px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;font-weight:700;font-size:16px}
.link-btn{color:var(--blue);font-weight:600;font-size:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{color:var(--faint);text-align:center;padding:26px 8px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--text2);border:1px solid transparent}
.chip.on{background:var(--blue-soft);color:var(--blue);border-color:#c7d7fe}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--surface2);font-weight:600;color:var(--text2)}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:#fdecec;color:var(--red)}
.btn.block{width:100%}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatch{width:12px;height:12px;border-radius:4px;flex:none}
.dday{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:1px 6px;flex:none}
.dday.past{color:var(--muted);background:var(--surface2)}
.dday.today{color:#fff;background:var(--red)}

/* 홈 */
.home-grid{display:grid;gap:14px}
.home-top{display:flex;justify-content:flex-end}
.weather{font-size:13px}
.greet{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.35;margin:4px 2px 2px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px 4px;font-size:13px;font-weight:700;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:4px}
.quick button b{font-size:18px;color:var(--blue);line-height:1}
.brief{position:relative;border-radius:16px;padding:2px;background:linear-gradient(120deg,#3b82f6,#8b5cf6)}
.brief-in{background:var(--surface);border-radius:14px;padding:14px 16px}
.brief-h{display:flex;align-items:center;gap:8px;font-weight:700}
.ai-badge{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(120deg,#3b82f6,#8b5cf6);border-radius:6px;padding:2px 6px}
.brief-text{white-space:pre-line;margin:10px 0 6px;font-size:14.5px;color:var(--text2)}
.brief .gen{margin-top:10px;background:linear-gradient(120deg,#3b82f6,#8b5cf6);color:#fff}
.brief-foot{margin-top:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.today-h{font-weight:800;font-size:17px;margin:4px 2px 0}
.feed-sec + .feed-sec{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.feed-head{display:flex;align-items:center;gap:2px;font-weight:700;color:var(--text);margin-bottom:6px}
.feed-item{display:flex;align-items:center;gap:10px;padding:7px 2px;min-height:38px;width:100%;text-align:left}
.feed-item .t{font-size:13px;color:var(--muted);flex:none;min-width:58px}
.feed-item.done .grow{color:var(--faint);text-decoration:line-through}
.check{width:22px;height:22px;border-radius:7px;border:2px solid #c6cbd5;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:var(--surface)}
.check.on{background:var(--blue);border-color:var(--blue)}
.check svg{width:14px;height:14px}
@media (min-width:900px){
  .page.home{max-width:1100px}
  .home-grid{grid-template-columns:1fr 1fr;align-items:start}
}

/* 캘린더 */
.cal{display:flex;flex-direction:column;height:100%;background:var(--surface)}
.cal-head{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px 6px}
.cal-head .title{font-weight:800;font-size:18px;display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px}
.cal-head .today-btn{margin-left:auto;padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:700}
.wk{flex:none;display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--muted);text-align:center;padding:4px 0;border-bottom:1px solid var(--line)}
.wk .sun{color:var(--red)} .wk .sat{color:var(--sat)} .wk .cur{font-weight:800;color:var(--text)} .wk .sun.cur{color:var(--red)}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 2px 2px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;cursor:pointer;text-align:left;background:var(--surface)}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:#fafbff}
.cell.other{background:#fafafa}
.cell.other .dnum,.cell.other .hol,.cell.other .bar{opacity:.38}
.dnum{flex:none;align-self:center;font-size:12.5px;font-weight:600;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cell.sun .dnum,.cell.holi .dnum{color:var(--red)}
.cell.sat .dnum{color:var(--sat)}
.cell.today .dnum{background:var(--blue);color:#fff}
.hol{flex:none;font-size:10px;color:var(--red);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:13px;padding:0 1px}
.lun{flex:none;font-size:9.5px;color:var(--faint);text-align:center;line-height:12px}
.evs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;margin-top:2px}
.bar{flex:none;height:17px;line-height:17px;font-size:11px;font-weight:600;color:#fff;border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;width:100%;text-align:left}
.bar.cont{border-top-left-radius:0;border-bottom-left-radius:0;opacity:.85}
.bar.past{opacity:.42}
.cell.other .bar.past{opacity:.3}
.bar .st{font-size:9px;margin-right:1px}
.bar .dl{font-size:9.5px;font-weight:800;background:rgba(255,255,255,.28);border-radius:3px;padding:0 3px;margin-right:3px}
.cal-head .icon-btn{width:34px;height:34px}
.more{flex:none;height:15px;font-size:10.5px;color:var(--muted);font-weight:700;text-align:left;padding:0 3px}
@media (max-width:699px){ .hol{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all;font-size:9.5px;line-height:11px} }
@media (min-width:700px){ .dnum{font-size:13.5px;width:26px;height:26px} .bar{font-size:12px;height:19px;line-height:19px} .hol{font-size:11px} .cell{padding:4px 4px 3px} }

/* 목록 탭 */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:11px 12px;display:flex;align-items:center;gap:10px}
.item .x{color:var(--faint);font-size:18px;width:30px;height:30px;border-radius:8px}
.item .x:hover{background:var(--surface2);color:var(--red)}
.item.done .title{color:var(--faint);text-decoration:line-through}
.due{font-size:12px;color:var(--muted)} .due.over{color:var(--red);font-weight:700} .due.today{color:var(--blue);font-weight:700}
.addbar{display:flex;gap:8px;margin-bottom:12px}
.habit-days{display:flex;gap:6px;margin-top:8px}
.hd{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.hd .c{width:30px;height:30px;border-radius:50%;border:2px solid #d5d9e2;display:flex;align-items:center;justify-content:center;color:#fff}
.hd .c.on{background:var(--green);border-color:var(--green)}
.hd .c.off{border-style:dashed;opacity:.35}
.hd.today{color:var(--blue);font-weight:800}
.streak{font-size:12px;font-weight:700;color:#ea580c}
.memo-text{white-space:pre-wrap;word-break:break-word}

/* 시트 / 대화상자 */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:500;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:18px 18px 0 0;z-index:501;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.15);animation:up .2s ease;padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (min-width:700px){ .sheet{left:50%;right:auto;width:600px;transform:translateX(-50%);bottom:16px;border-radius:18px;max-height:calc(100dvh - 40px)} @keyframes up{from{transform:translate(-50%,30px);opacity:.6}to{transform:translate(-50%,0)}} }
.handle{width:40px;height:5px;border-radius:3px;background:#d1d5db;margin:8px auto 2px;flex:none}
.sheet-head{flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px 6px}
.sheet-head h2{flex:1;margin:0;font-size:16px;text-align:center}
.sheet-body{flex:1;overflow:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.save-btn{color:var(--blue)}
.fav-on{color:#f59e0b}
.title-input{border:0;font-size:22px;font-weight:700;padding:8px 2px;border-radius:0;border-bottom:1px solid var(--line)}
.title-input:focus{outline:0;border-bottom-color:var(--blue)}
.chips{display:flex;gap:8px;margin:12px 0 6px;flex-wrap:wrap}
.pop{background:var(--surface2);border-radius:12px;padding:10px;margin:6px 0 4px}
.palette{display:flex;gap:10px;flex-wrap:wrap}
.palette button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.palette button.on{box-shadow:0 0 0 2px var(--text)}
.date-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.date-row .d{font-size:16px;font-weight:700;color:var(--text)}
.switch{position:relative;width:46px;height:28px;border-radius:14px;background:#d1d5db;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked=true]{background:var(--blue)}
.switch[aria-checked=true]::after{left:21px}
.opt{border-bottom:1px solid var(--line)}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 2px;text-align:left}
.opt-row .ic{width:22px;height:22px;color:var(--muted);flex:none}
.opt-row .lb{font-weight:600}
.opt-row .val{margin-left:auto;color:var(--muted);font-size:13.5px;text-align:right;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-row .chev{color:var(--faint);flex:none;transition:transform .15s}
.opt.open .chev{transform:rotate(90deg)}
.opt-panel{padding:2px 2px 14px 34px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-size:12.5px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.daybtn{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-weight:700;font-size:13px}
.daybtn.on{background:var(--blue);color:#fff}
.radio{display:flex;align-items:center;gap:8px;font-size:14px}
.radio input{width:auto}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px;line-height:1.5}
.err{font-size:12.5px;color:var(--red)}
.att-head{display:flex;align-items:center;gap:10px}
.att-limit{margin-left:auto;font-size:12.5px;color:var(--faint);text-align:right}
.att-list{display:flex;flex-direction:column;gap:8px}
.att{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:6px 8px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#e5e7eb;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);overflow:hidden}
.att .acts{display:flex;gap:4px}
.att .acts button{padding:6px 8px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--blue)}
.att .acts button.del{color:var(--red)}
.attendee{display:grid;grid-template-columns:1fr 1.4fr 32px;gap:6px;align-items:center}
.dialog-wrap{position:fixed;inset:0;z-index:1500;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.42);padding:20px}
.dialog{background:var(--surface);border-radius:16px;padding:20px 18px 14px;width:min(380px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{margin:0 0 6px;font-size:17px}
.dialog p{margin:0 0 14px;color:var(--text2);font-size:14.5px;white-space:pre-line;max-height:50vh;overflow:auto}
.dialog .btns{display:flex;flex-direction:column;gap:8px}
.set-sec{margin-top:18px}
.set-sec h3{font-size:14px;margin:0 0 8px;color:var(--muted)}
.set-card{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#c4c9d4;flex:none}
.sync-dot[data-st=on]{background:#22c9a0}.sync-dot[data-st=syncing],.sync-dot[data-st=connecting]{background:#ffb38a}.sync-dot[data-st=error]{background:#ff4d6d}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top;word-break:break-all}
.pass{color:var(--green);font-weight:800} .fail{color:var(--red);font-weight:800}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.month-grid button{padding:12px 0;border-radius:10px;background:var(--surface2);font-weight:700}
.month-grid button.on{background:var(--blue);color:#fff}
.hidden{display:none!important}

/* ===== 상큼 발랄 테마 ===== */
:root{
  --bg:#fffaf3; --surface:#ffffff; --surface2:#f6f3ff; --text:#2b2840; --text2:#4a4663; --muted:#8a85a3; --faint:#b8b3cc;
  --line:#f0ebf7; --blue:#4f9dff; --blue-soft:#e9f3ff; --red:#ff4d6d; --sat:#4f9dff; --green:#22c9a0;
  --pink:#ff7eb6; --peach:#ffb38a; --lemon:#ffd84d; --mint:#3ddbb0; --lilac:#b79cff;
  --radius:20px; --shadow:0 2px 0 rgba(183,156,255,.10),0 8px 22px rgba(255,126,182,.10);
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",-apple-system,system-ui,sans-serif;
}
body{background:
  radial-gradient(600px 300px at 0% 0%, #ffe8f2 0%, transparent 60%),
  radial-gradient(600px 320px at 100% 10%, #e3f6ff 0%, transparent 60%),
  radial-gradient(700px 400px at 50% 110%, #fff4cf 0%, transparent 60%), var(--bg) fixed}
.top{background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-weight:800}
.avatar{background:linear-gradient(135deg,#ff9ac7,#ffb38a 60%,#ffd84d);box-shadow:0 3px 10px rgba(255,126,182,.35)}
.icon-btn:hover{background:#fff0f7}
main{background:transparent}
.tabbar{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-left:6px;padding-right:6px}
.tabbar button{color:#b3aec6;position:relative}
.tabbar button svg{transition:transform .2s}
.tabbar button[aria-selected=true]{color:var(--tc,#4f9dff)}
.tabbar button[aria-selected=true]::before{content:"";position:absolute;top:7px;width:46px;height:30px;border-radius:15px;background:var(--tb,#e9f3ff);z-index:0}
.tabbar button[aria-selected=true] svg{transform:translateY(-1px) scale(1.08)}
.tabbar button > *{position:relative;z-index:1}
.tabbar button[data-tab=home]{--tc:#ff5c8a;--tb:#ffe6ef}
.tabbar button[data-tab=calendar]{--tc:#4f9dff;--tb:#e3f0ff}

<script>
'use strict';
/* =====================================================================
 * 지니 스케줄 — 데이터 계층 (날짜 · 음력 · 공휴일 · 반복 · 저장소 · 입출력)

const APP_VERSION = '1.5.0';
const SCHEMA_VERSION = 2;
const LS_KEY = 'schedule_v2';
const LS_OLD_KEYS = ['schedule_v1', 'schedule'];
const IDB_NAME = 'schedule_files_v2';
const IDB_STORE = 'files';
const LIMITS = { maxFiles: 10, maxFileSize: 10 * 1024 * 1024, maxTotalSize: 50 * 1024 * 1024 };
const ATTACH_LIMIT_MSG = '첨부는 최대 10개까지만 가능합니다.';
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const RRULE_DAYS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
const ALLDAY_ALARM_HOUR = 9; // 종일 일정 알림 기준 시각(오전 9시)
const LUNAR_EXPORT_YEARS = 10; // 음력 반복 ICS 전개 기간

/* 요일별 인사 문구(일~토) — 데이터로 분리 */
const GREETINGS = [
  '일요일이에요! 포근하게 충전하는 하루 보내세요! 🧸☁️',
  '월요일이에요! 힘차게 한 주를 시작해요! 🐥💪',
  '화요일이에요! 차근차근 리듬을 만들어 가요! 🌷',
  '수요일이에요! 한 주의 절반, 잘하고 있어요! 🐳💙',
  '목요일이에요! 조금만 더 힘내요, 주말이 코앞이에요! 🍀',
  '금요일이에요! 한 주를 멋지게 마무리하세요! 🎉',
  '토요일이에요! 여유롭고 즐거운 주말 보내세요! 🌈🍓'
];

const PALETTE = ['#4f9dff', '#ff5c8a', '#ffa83e', '#22c9a0', '#a78bfa', '#ff7eb6', '#2ec5e0', '#ff8a5c', '#7c8cff', '#8ccf4d'];
const DEFAULT_CATEGORIES = [
  { id: 'personal', name: '개인', color: '#4f9dff' },
  { id: 'work', name: '업무', color: '#ffa83e' },
  { id: 'school', name: '학교', color: '#22c9a0' }
];
const REMINDER_OPTIONS = [
  { min: 0, label: '정시' }, { min: 5, label: '5분 전' }, { min: 10, label: '10분 전' },
  { min: 30, label: '30분 전' }, { min: 60, label: '1시간 전' }, { min: 1440, label: '1일 전' }
];

/* ---------------------------------------------------------------------
 * 날짜 유틸 — 모든 날짜는 'YYYY-MM-DD' 문자열, 계산은 UTC 일수(dn)로.
 * new Date('YYYY-MM-DD') 같은 UTC 해석 생성자는 사용하지 않는다.
 * ------------------------------------------------------------------- */
const pad = n => String(n).padStart(2, '0');
function ymd(y, m, d) { return String(y).padStart(4, '0') + '-' + pad(m) + '-' + pad(d); }
function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function parseYmd(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12 || d < 1 || d > daysInMonth(y, mo)) return null;
  return { y, m: mo, d };
}
const isYmd = s => !!parseYmd(s);
function dn(s) { const p = parseYmd(s); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 864e5); }
function fromDn(n) { const t = new Date(n * 864e5); return ymd(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }
const addDays = (s, k) => fromDn(dn(s) + k);
const weekday = s => (((dn(s) + 4) % 7) + 7) % 7; // 1970-01-01 = 목(4)
function todayYmd() { const t = new Date(); return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
function nowMinutes() { const t = new Date(); return t.getHours() * 60 + t.getMinutes(); }
function isHm(t) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(t || ''); }
function hmToMin(t) { return isHm(t) ? (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)) : null; }
function minToHm(m) { m = Math.max(0, Math.min(1439, m)); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function fmtMD(s) { const p = parseYmd(s); return `${p.m}월 ${p.d}일 ${WEEKDAYS[weekday(s)]}`; }
function fmtShort(s) { const p = parseYmd(s); return `${p.m}/${p.d}(${WEEKDAYS[weekday(s)]})`; }
function fmtHmKo(t) {
  const m = hmToMin(t); if (m == null) return '';
  const h = Math.floor(m / 60), mi = m % 60;
  return `${h < 12 ? '오전' : '오후'} ${h % 12 === 0 ? 12 : h % 12}:${pad(mi)}`;
}
function nowIso() { return new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'); }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.random() * 256 | 0);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
const clone = o => JSON.parse(JSON.stringify(o));
function startOfWeekSun(s) { return addDays(s, -weekday(s)); }

/* ---------------------------------------------------------------------
 * 음력 — 한국천문연구원(KASI) 기준 음력 연도 테이블 (2019~2037)
 *  s: 음력 1월 1일의 양력 날짜, l: 각 달 길이(1=30일, 0=29일, 윤달 포함 순서),
 *  leap: 윤달 월(0=없음). 근사 공식 없이 이 테이블로만 계산한다.
 * ------------------------------------------------------------------- */
const LUNAR_DATA = {"2019":{"s":"2019-02-05","l":"101010010101","leap":0},"2020":{"s":"2020-01-25","l":"1011010010101","leap":4},"2021":{"s":"2021-02-12","l":"011010101010","leap":0},"2022":{"s":"2022-02-01","l":"101011010101","leap":0},"2023":{"s":"2023-01-22","l":"0101010110101","leap":2},"2024":{"s":"2024-02-10","l":"010010110110","leap":0},"2025":{"s":"2025-01-29","l":"1010010101110","leap":6},"2026":{"s":"2026-02-17","l":"101001010111","leap":0},"2027":{"s":"2027-02-07","l":"010100100111","leap":0},"2028":{"s":"2028-01-27","l":"0110100100110","leap":5},"2029":{"s":"2029-02-13","l":"110110010011","leap":0},"2030":{"s":"2030-02-03","l":"010110101010","leap":0},"2031":{"s":"2031-01-23","l":"1010101101010","leap":3},"2032":{"s":"2032-02-11","l":"100101101101","leap":0},"2033":{"s":"2033-01-31","l":"0100101011101","leap":11},"2034":{"s":"2034-02-19","l":"010010101110","leap":0},"2035":{"s":"2035-02-08","l":"101001001101","leap":0},"2036":{"s":"2036-01-28","l":"1101001001101","leap":6},"2037":{"s":"2037-02-15","l":"110100100101","leap":0}};
const LUNAR = (() => {
  const out = {};
  for (const ys of Object.keys(LUNAR_DATA)) {
    const r = LUNAR_DATA[ys], seq = [];
    for (let mm = 1; mm <= 12; mm++) { seq.push([mm, false]); if (r.leap === mm) seq.push([mm, true]); }
    if (seq.length !== r.l.length) throw new Error('음력 테이블 오류: ' + ys);
    let off = 0;
    const months = seq.map((s, i) => { const len = r.l[i] === '1' ? 30 : 29; const o = { m: s[0], leap: s[1], len, off }; off += len; return o; });
    out[+ys] = { start: dn(r.s), startYmd: r.s, months, total: off, leap: r.leap };
  }
  return out;
})();
const LUNAR_MIN = Math.min(...Object.keys(LUNAR).map(Number));
const LUNAR_MAX = Math.max(...Object.keys(LUNAR).map(Number));

function solarToLunar(s) {
  if (!isYmd(s)) return null;
  const n = dn(s);
  for (let y = LUNAR_MIN; y <= LUNAR_MAX; y++) {
    const Y = LUNAR[y];
    if (n >= Y.start && n < Y.start + Y.total) {
      let k = n - Y.start;
      for (const mo of Y.months) { if (k < mo.len) return { year: y, month: mo.m, day: k + 1, leap: mo.leap }; k -= mo.len; }
    }
  }
  return null;
}
function lunarToSolar(y, m, d, leap) {
  const Y = LUNAR[y]; if (!Y) return null;
  const mo = Y.months.find(x => x.m === m && x.leap === !!leap);
  if (!mo || d < 1 || d > mo.len) return null;
  return fromDn(Y.start + mo.off + d - 1);
}
function lunarText(s) { const l = solarToLunar(s); return l ? `${l.leap ? '윤' : ''}${l.month}.${l.day}` : ''; }
/* 음력 반복 규칙
 *  ① 윤달 기준 일정(isLeapMonth=true): 그 해에 같은 윤달이 있으면 윤달 날짜, 없으면 평달 같은 날짜.
 *  ② 평달 기준 일정: 항상 평달 날짜(그 해 윤달은 무시).
 *  ③ 30일 일정인데 그 해 해당 달이 29일까지면 29일(그 달의 마지막 날)로 표시.
 *  ④ 지원 범위(2019~2037 음력 연도) 밖은 표시하지 않는다. */
function lunarRepeatDate(lr, ly) {
  const Y = LUNAR[ly]; if (!Y || !lr) return null;
  let mo = lr.isLeapMonth ? Y.months.find(x => x.m === lr.month && x.leap) : null;
  if (!mo) mo = Y.months.find(x => x.m === lr.month && !x.leap);
  if (!mo) return null;
  const d = Math.min(lr.day, mo.len);
  return fromDn(Y.start + mo.off + d - 1);
}

/* ---------------------------------------------------------------------
 * 공휴일 — HOLIDAYS 객체(기본값) + 설정의 사용자 수정(holidayOverrides)
 *  기본값은 법정 공휴일 규칙(양력·음력 + 대체공휴일)으로 연도별 계산.
 *  2026년 결과는 자체 테스트에서 공표된 목록과 일치하는지 검증한다.
 * ------------------------------------------------------------------- */
const SPECIAL_HOLIDAYS = { // 선거일·임시공휴일 등 규칙으로 계산할 수 없는 날
  '2020-04-15': '국회의원선거', '2020-08-17': '임시공휴일', '2022-03-09': '대통령선거',
  '2022-06-01': '전국동시지방선거', '2023-10-02': '임시공휴일', '2024-04-10': '국회의원선거',
  '2024-10-01': '국군의날', '2025-01-27': '임시공휴일', '2025-06-03': '대통령선거',
  '2026-06-03': '전국동시지방선거'
};
function computeHolidays(year) {
  const base = []; // {date, name, sub:'none'|'sun'|'weekend', group}
  const add = (date, name, sub, group) => { if (date) base.push({ date, name, sub, group: group || name }); };
  add(ymd(year, 1, 1), '신정', 'none');
  const seol = lunarToSolar(year, 1, 1, false);
  if (seol) [-1, 0, 1].forEach(k => add(addDays(seol, k), k ? '설날 연휴' : '설날', 'sun', '설날'));
  add(ymd(year, 3, 1), '3·1절', year >= 2021 ? 'weekend' : 'none');
  if (year >= 2026) add(ymd(year, 5, 1), '노동절', 'weekend');
  add(ymd(year, 5, 5), '어린이날', 'weekend');
  add(lunarToSolar(year, 4, 8, false), '부처님오신날', year >= 2023 ? 'weekend' : 'none');
  add(ymd(year, 6, 6), '현충일', 'none');
  if (year >= 2026) add(ymd(year, 7, 17), '제헌절', 'weekend');
  add(ymd(year, 8, 15), '광복절', year >= 2021 ? 'weekend' : 'none');
  const chu = lunarToSolar(year, 8, 15, false);
  if (chu) [-1, 0, 1].forEach(k => add(addDays(chu, k), k ? '추석 연휴' : '추석', 'sun', '추석'));
  add(ymd(year, 10, 3), '개천절', year >= 2021 ? 'weekend' : 'none');
  add(ymd(year, 10, 9), '한글날', year >= 2021 ? 'weekend' : 'none');
  add(ymd(year, 12, 25), '성탄절', year >= 2023 ? 'weekend' : 'none');
  for (const [d, n] of Object.entries(SPECIAL_HOLIDAYS)) if (d.startsWith(year + '-')) add(d, n, 'none');

  const map = {};
  for (const b of base) map[b.date] = map[b.date] ? (map[b.date].split('·').includes(b.name) ? map[b.date] : map[b.date] + '·' + b.name) : b.name;
  const countOn = d => base.filter(b => b.date === d).length;
  const isOff = d => !!map[d] || weekday(d) === 0 || weekday(d) === 6;
  // 대체공휴일 대상 그룹
  const groups = {};
